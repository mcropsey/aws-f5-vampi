global:
  noname:
    enabled: false
  platform:
    enabled: false
  active:
    enabled: false
  backend:
    secrets:
      INITIAL_INPUT_PASS: "LabOnly-NotUsed1!"
  engine:
    enabled: true
    # The chart defaults to "medium", which requests 17300m CPU across all pods
    # (heavy-engine 7 + nats 5 + router HPA floor of 4 replicas) and cannot fit
    # on this 16 vCPU m5.4xlarge — the engine pod sits Pending on
    # "Insufficient cpu" forever. "micro" totals 8300m / 15G and is far more
    # than this lab's traffic needs. Step up to "small" (12300m / 25G) if you
    # want more throughput headroom; do not go back to "medium" on this node.
    engineSizing: "micro"
    # "for nic integration" per the chart. Required for the F5 clone pool:
    # light-engine's VXLAN listener (portl 4789) only binds on the node when it
    # runs with host networking. Without this, nothing listens on
    # 10.0.8.100:4789 and mirrored traffic is silently discarded. Must be the
    # string "true" — the template does `eq ... "true"`. Also forces
    # light-engine maxReplicas to 1, and switches it to the
    # resourceWithHostNetwork sizing table (micro = 2 CPU / 4G).
    hostNetwork: "true"
    engine_id: "1833bb50-fdc3-491d-86d1-d694ee77b52c"
    remote_keys_encoded: ""
    re_client_certificate: ""
    re_client_private_key: ""
    env:
      SETCAP: "false"
      COLLECTOR_TYPE: "remote"
      MANAGEMENT_IP: "michaelc-lab.nonamesec.com"
      DATA_ORCHESTRATION_ENABLE_SSL: "true"
      DATA_ORCHESTRATION_ENABLE_SERVER_CERTIFICATE_VERIFICATION: "false"
    volume:
      existingPVCName: null
  engine_platform:
    env:
      DATA_ORCHESTRATION_PUBLIC_HOSTNAME: "michaelc-lab.nonamesec.com"
      DATA_ORCHESTRATION_PUBLIC_HOSTNAME_MTLS: "michaelc-lab-mtls.nonamesec.com"
  imageCredentials:
    enabled: true
    registry: "us-central1-docker.pkg.dev/noname-artifacts/nns-docker"
    namespaceRegistry: "us-central1-docker.pkg.dev/noname-artifacts/nns-docker"
    username: "_json_key_base64"
    password: ""
    email: "_json_key_base64"

router:
  env:
    COLLECTOR_TYPE: "remote"
    DATA_ORCHESTRATION_ENABLE_SSL: "true"
  autoscaling:
    enabled: true

securityContext:
  allowPrivilegeEscalation: false
  seccompProfile:
    type: RuntimeDefault
  capabilities:
    drop:
      - ALL

ingress:
  enabled: true
  ingressClassName: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "2000m"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  hosts:
    - host: engine.michaelc-lab.local
      paths:
        - path: /
          pathType: Prefix
